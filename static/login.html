<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - OmniAssist</title>
<link rel="icon" href="/favicon.ico">
  <style>
    :root {
      --bg-primary: #ffffff;
      --text-primary: #1a1a2e;
      --text-secondary: #6b6b80;
      --text-muted: #9a9ab0;
      --accent: #1976d2;
      --accent-hover: #1565c0;
      --danger: #ef5350;
      --border: #e0e0e8;
      --transition: 0.2s ease;

      /* 字体：不引外部字体（离线部署、国内网络取不到），靠系统栈分层 + 排版参数做质感。
         西文走 SF / Segoe，中文落 PingFang / 雅黑，各用各的最优字形。 */
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
                   "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei",
                   Roboto, "Helvetica Neue", Arial, sans-serif;
      /* 字标：西文优先，字距更紧、字重更高 */
      --font-brand: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI",
                    "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      /* 等宽：验证码、技术文本 */
      --font-mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, "Courier New", monospace;

      /* 照片加载前的兜底底色，避免先闪一帧纯白 */
      --scene-fallback: #dfe7f2;

      /* 背景：一张真实拍摄的离焦散景照片，不再用 CSS 拼几何图层。
         时段只叠一层极轻的色调，不影响画面结构与元素丰富度。 */
      --scene-photo: url('/static/img/bg-light.jpg');
      --scene-photo-filter: brightness(1.02) saturate(1.04);
      /* 照片上的一层薄白：把背景提到"高调"，白卡片才浮得住 */
      --scene-veil: linear-gradient(rgba(248, 250, 255, 0.16), rgba(248, 250, 255, 0.16));
      --scene-tint: transparent;
      --scene-vignette: radial-gradient(132% 96% at 50% 44%, transparent 46%, rgba(18, 28, 56, 0.20) 100%);

      /* 玻璃面板：左右同一种材质，只差厚度。
         右区不是"不透明的白块"，而是同一层玻璃压得更实——否则接缝处会读成两块不同的东西。 */
      --panel-edge: rgba(255, 255, 255, 0.72);
      --panel-shadow: 0 30px 80px rgba(16, 26, 54, 0.22), 0 2px 8px rgba(16, 26, 54, 0.08);
      --panel-form-bg: radial-gradient(620px 280px at 2% -14%, rgba(176, 206, 255, 0.30), transparent 68%),
                       linear-gradient(180deg, rgba(250, 252, 255, 0.72), rgba(244, 248, 255, 0.86));
      --seam: rgba(16, 34, 68, 0.05);
      /* 浅色下接缝两侧本来就有 20 级亮度差：把右侧边缘压回与左区同一明度，
         再由它往右自然回亮——读起来是「折了一道」，不是「拼了一块」 */
      --seam-fade: rgba(16, 34, 68, 0.20);

      /* 左区 */
      --showcase-bg: linear-gradient(155deg, rgba(214, 233, 255, 0.72) 0%, rgba(233, 228, 255, 0.72) 54%, rgba(206, 243, 240, 0.72) 100%);
      /* 左区靠接缝一侧压暗：两块玻璃在交界处的明度先接近，接缝才不像一刀切 */
      --showcase-shade: rgba(16, 34, 68, 0.10);
      --showcase-lift: radial-gradient(520px 320px at 16% 4%, rgba(255, 255, 255, 0.34), transparent 70%),
                       radial-gradient(440px 280px at 94% 96%, rgba(255, 255, 255, 0.18), transparent 72%);
      --showcase-title: #0f172a;
      --showcase-text: #47536b;
      --flow-line: rgba(62, 102, 188, 0.38);
      --flow-dot: rgba(42, 86, 176, 0.52);
      --flow-dot-fill: #ffffff;
      --flow-halo: rgba(96, 150, 230, 0.12);
    }

    .dark {
      --bg-primary: #101018;
      --text-primary: #e8e8f0;
      --text-secondary: #a8a8bb;
      --text-muted: #6f6f85;
      --accent: #3b82f6;
      --accent-hover: #2f74e0;
      --border: #2a2a36;
      --scene-fallback: #06070d;

      --scene-photo: url('/static/img/bg-dark.jpg');
      --scene-photo-filter: brightness(0.94) saturate(1.06);
      --scene-veil: none;
      --scene-vignette: radial-gradient(132% 96% at 50% 44%, transparent 30%, rgba(0, 0, 0, 0.62) 100%);

      --panel-edge: rgba(255, 255, 255, 0.10);
      --panel-shadow: 0 30px 80px rgba(0, 0, 0, 0.66), 0 2px 8px rgba(0, 0, 0, 0.44);
      /* 原来这里是 88% 的近黑实色，与左侧 60% 的通透玻璃并排，接缝像被切了一刀。
         压到 74~84% 让同一张照片也能透过来，左轻右重但同源。 */
      --panel-form-bg: radial-gradient(620px 280px at 2% -14%, rgba(110, 150, 220, 0.12), transparent 68%),
                       linear-gradient(180deg, rgba(13, 17, 30, 0.70), rgba(9, 12, 21, 0.84));
      /* 深色下这条 1px 白发丝太扎眼，会把接缝读成"切开"；留 3% 只做玻璃边线的暗示 */
      --seam: rgba(255, 255, 255, 0.035);
      --seam-fade: rgba(0, 0, 0, 0.52);

      --showcase-bg: linear-gradient(155deg, rgba(14, 19, 36, 0.58) 0%, rgba(18, 16, 33, 0.58) 54%, rgba(10, 22, 27, 0.58) 100%);
      --showcase-shade: rgba(3, 5, 12, 0.50);
      /* 深色下这两团白光必须收掉：照片的亮云 + 34% 白柔光叠在一起，
         左区会变成一块发灰的雾，跟右区的深蓝黑彻底脱节 */
      --showcase-lift: radial-gradient(520px 320px at 16% 4%, rgba(255, 255, 255, 0.10), transparent 70%),
                       radial-gradient(440px 280px at 94% 96%, rgba(150, 180, 255, 0.06), transparent 72%);
      --showcase-title: #eef2ff;
      --showcase-text: #a2aec4;
      --flow-line: rgba(140, 180, 255, 0.26);
      --flow-dot: rgba(158, 200, 255, 0.50);
      --flow-dot-fill: #0f1219;
      --flow-halo: rgba(120, 170, 255, 0.14);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: var(--font-sans);
      background: var(--scene-fallback);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      padding: 24px;
      /* 浅底深字在 macOS 上默认会描粗，关掉子像素平滑字形才干净 */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    input, button, select, textarea { font-family: inherit; }

    /* ============================================================
       背景：一张照片 + 两层调节（时段色调、暗角）
       摄影产生的景深与镜面反光，是手写渐变做不出来的东西
       ============================================================ */
    .scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .scene-photo {
      position: absolute;
      inset: -2%;
      background-image: var(--scene-veil), var(--scene-photo);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: var(--scene-photo-filter);
      transition: filter 0.6s ease;
    }

    /* 时段色调：极轻的一层，只在换上/夜里让画面偏一点冷暖 */
    .scene-tint {
      position: absolute;
      inset: 0;
      background: var(--scene-tint);
      transition: background 0.9s ease;
    }

    /* 暗角：把视线收回中间的面板 */
    .scene-vignette {
      position: absolute;
      inset: 0;
      background: var(--scene-vignette);
    }

    body.time-morning   { --scene-tint: linear-gradient(160deg, rgba(255, 190, 122, 0.10), transparent 56%); }
    body.time-noon      { --scene-tint: linear-gradient(160deg, rgba(160, 205, 255, 0.07), transparent 56%); }
    body.time-afternoon { --scene-tint: linear-gradient(160deg, rgba(96, 165, 250, 0.08), transparent 56%); }
    body.time-evening   { --scene-tint: linear-gradient(160deg, rgba(251, 146, 60, 0.12), transparent 58%); }
    body.time-night     { --scene-tint: linear-gradient(160deg, rgba(22, 34, 74, 0.22), rgba(6, 10, 26, 0.14) 66%); }
    .dark body.time-morning   { --scene-tint: linear-gradient(160deg, rgba(126, 74, 32, 0.16), transparent 56%); }
    .dark body.time-noon      { --scene-tint: linear-gradient(160deg, rgba(28, 54, 96, 0.14), transparent 56%); }
    .dark body.time-afternoon { --scene-tint: linear-gradient(160deg, rgba(18, 40, 84, 0.16), transparent 56%); }
    .dark body.time-evening   { --scene-tint: linear-gradient(160deg, rgba(104, 44, 38, 0.18), transparent 58%); }
    .dark body.time-night     { --scene-tint: linear-gradient(160deg, rgba(6, 10, 28, 0.34), rgba(2, 4, 12, 0.26) 66%); }

    /* ============================================================
       登录面板
       ============================================================ */
    .login-container {
      display: flex;
      width: 940px;
      max-width: 100%;
      min-height: 560px;
      backdrop-filter: blur(26px) saturate(140%);
      -webkit-backdrop-filter: blur(26px) saturate(140%);
      border-radius: 20px;
      box-shadow: var(--panel-shadow);
      overflow: hidden;
      position: relative;
      z-index: 1;
      border: 1px solid var(--panel-edge);
    }

    /* ---------- 左：一条从"下达"到"产出"的动线 ---------- */
    .login-showcase {
      flex: 1.05;
      background: var(--showcase-bg);
      display: flex;
      flex-direction: column;
      padding: 40px 38px 38px;
      position: relative;
      overflow: hidden;
      /* 接缝一侧的暗部，与右区左侧的内阴影对接，合成一道"折光"。
         范围要够宽：照片的亮斑正好落在左区右下角，压窄了会形成一条亮边贴着接缝。 */
      box-shadow: inset -104px 0 88px -58px var(--showcase-shade);
    }
    /* 展示区自身一层柔光，让半透明底色有明暗，不像贴了块色板 */
    .login-showcase::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--showcase-lift);
      pointer-events: none;
    }
    .login-showcase > * { position: relative; }

    .show-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    /* 标志：全向环（Omni）+ 中心核心。缺口留在右下，对应"向外交付"。
       不用字母缩写方块——那是占位做法，缩到 28px 就成了两个糊字。 */
    .show-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(59, 130, 246, 0.34), 0 1px 2px rgba(16, 26, 54, 0.10);
      flex-shrink: 0;
    }
    .show-logo svg {
      width: 42px;
      height: 42px;
      display: block;
      border-radius: 12px;
    }
    /* 字标：Omni / Assist 分段着色，后半截用品牌蓝，一眼看出是两个词 */
    .show-brand-name {
      font-family: var(--font-brand);
      font-size: 17.5px;
      font-weight: 700;
      color: var(--showcase-title);
      letter-spacing: -0.3px;
      line-height: 1.25;
    }
    .show-brand-name .bn-mark { color: var(--accent); }
    .show-brand-tag {
      font-size: 11.5px;
      color: var(--showcase-text);
      margin-top: 2px;
      /* 中文小字拉开字距才不显得挤成一团 */
      letter-spacing: 0.8px;
      line-height: 1.3;
    }

    /* 标题 + 动线 + 交付形态 是一个整体，居中落在品牌下方。
       以前标题固定 50px、动线又被推到最底，中间空出 130px 的洞，整列像是没排完。 */
    .show-copy {
      margin-top: auto;
      margin-bottom: auto;
      min-width: 0;
    }

    .show-headline {
      font-size: 31px;
      font-weight: 700;
      line-height: 1.36;
      color: var(--showcase-title);
      letter-spacing: -0.4px;
      flex-shrink: 0;
    }

    /* 流程：一条竖线串起三步，终点落在产出的文件上 */
    .show-flow {
      list-style: none;
      position: relative;
      margin-top: 34px;
      padding-left: 28px;
    }
    .show-flow::before {
      content: '';
      position: absolute;
      left: 10px;
      top: 21px;
      /* 止于最后一颗圆点的下沿：线再往下延伸就会悬空怼到交付形态那一行上 */
      bottom: 15px;
      width: 1px;
      background: var(--flow-line);
    }
    .show-flow-item {
      position: relative;
      padding: 11px 0;
      font-size: 13.5px;
      line-height: 20px;
      color: var(--showcase-title);
      letter-spacing: 0.1px;
    }
    .show-flow-item::before {
      content: '';
      position: absolute;
      left: -24px;
      top: 15px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--flow-dot-fill);
      border: 1px solid var(--flow-dot);
    }
    /* 最后一步填实：动线走到这里就结束了。
       末尾不再挂"产出格式"那行之后，靠这颗实心点收束，不需要再加文字。 */
    .show-flow-item:last-child::before {
      background: var(--flow-dot);
      box-shadow: 0 0 0 3px var(--flow-halo);
    }

    /* 动线自己收尾，末尾不再挂"产出格式"这类说明。
       试过具体文件名（被读成假数据）、四个格式徽章（被读成四个按钮）、
       一行"产出 Word/Excel/PPT/PDF"（普通），都属于"讲产品能产出什么"——
       左边要说的是"怎么用"，不是"会给你什么"。 */

    /* ---------- 右：表单 ---------- */
    .login-form {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 44px;
      min-width: 0;
      position: relative;
      background: var(--panel-form-bg);
      /* 接缝：一条极细的线 + 从线往右晕开的暗部。
         只有一根 1px 实线时，两块板是"拼"起来的；加一层衰减阴影才像一块板被折了一道。 */
      box-shadow: inset 76px 0 62px -52px var(--seam-fade),
                  inset 1px 0 0 var(--seam);
    }

    /* 表单标题比左侧标题低一档：两边同号同粗时，视线会先在两块"大标题"之间来回跳 */
    .login-form h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      /* 副标题删掉后，标题与第一个字段之间靠这一个值定距 */
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.4px;
      margin-bottom: 7px;
    }

    .form-group input {
      width: 100%;
      padding: 0 14px;
      /* 与验证码字段同高：两块并排时差 2px 会被一眼看出来 */
      height: 46px;
      line-height: 46px;
      font-size: 14px;
      border: 1px solid #dde1ea;
      border-radius: 10px;
      background: #f4f6fa;
      color: var(--text-primary);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }
    .dark .form-group input { border-color: #2f3140; background: #191b24; }

    .form-group input:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }

    .form-group input:focus {
      border-color: var(--accent);
      background: var(--bg-primary);
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.14);
    }
    .dark .form-group input:focus { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.22); }

    /* 图形验证码：输入框 / 图片 / 刷新合成一个字段。
       图片是整块里唯一的高亮白面，所以不能顶边——顶边就成了一道白条。
       现在它是一块带圆角的独立小卡，四周留出深色缝，白面被"框住"而不是"露出来"。 */
    .captcha-field {
      display: flex;
      align-items: center;
      height: 46px;
      border: 1px solid #dde1ea;
      border-radius: 10px;
      background: #f4f6fa;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }
    .dark .captcha-field { border-color: #2f3140; background: #191b24; }

    .captcha-field:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }

    /* 焦点落在整块上：光标在验证码输入框里时，图片和刷新按钮一起被点亮 */
    .captcha-field:focus-within {
      border-color: var(--accent);
      background: var(--bg-primary);
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.14);
    }
    .dark .captcha-field:focus-within {
      background: #12141c;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.22);
    }

    .captcha-field input {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 0 8px 0 14px;
      border: none;
      background: transparent;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    /* 抵掉 .form-group input 的通用规则：验证码输入自己不带边框和阴影，
       边框、底色、聚焦光环全部由外层容器统一表现，否则会出现两层阴影。 */
    .captcha-field input:hover,
    .captcha-field input:focus {
      border-color: transparent;
      background: transparent;
      box-shadow: none;
    }

    .captcha-img {
      /* 后端固定出 150x52 的图，等比缩到 34 高约 98 宽。
         宽度写死是为了占位：图片没到之前先留出同样的空间，否则整行会跳一下 */
      flex: 0 0 98px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border-radius: 6px;
      overflow: hidden;
      background: #ffffff;
      /* 一层发丝级描边定形：白面在黑底上不描边会显得边缘发虚、像漏光 */
      box-shadow: 0 0 0 1px rgba(16, 34, 68, 0.10), 0 1px 2px rgba(16, 34, 68, 0.08);
      cursor: pointer;
      user-select: none;
      transition: box-shadow var(--transition);
    }
    .dark .captcha-img { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 2px 8px rgba(0, 0, 0, 0.45); }
    .captcha-img:hover { box-shadow: 0 0 0 1px rgba(25, 118, 210, 0.55), 0 1px 3px rgba(16, 34, 68, 0.10); }
    .dark .captcha-img:hover { box-shadow: 0 0 0 1px rgba(120, 170, 255, 0.55), 0 2px 8px rgba(0, 0, 0, 0.45); }

    /* 深色下把白面压到 90%、略降饱和：黑底上一块纯白 + 彩色字母是全页最亮的东西，
       压一档之后它退到"可读的部件"，不再是贴上去的贴纸 */
    .captcha-img img {
      height: 34px;
      width: auto;
      display: block;
    }
    .dark .captcha-img img { filter: brightness(0.9) saturate(0.8); }

    /* 后端没给图、只给字符时的兜底 */
    .captcha-img .captcha-text {
      font-family: var(--font-mono);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #2a56b0;
      padding: 0 9px;
    }

    /* 验证码取不到时的提示（点击图片即可重试） */
    .captcha-retry {
      font-size: 11.5px;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      white-space: nowrap;
      padding: 0 6px;
    }

    /* 刷新：不再是"第三个格子"，就是图片右侧一枚图标，hover 才有底 */
    .captcha-btn {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      margin: 0 9px 0 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color var(--transition), background var(--transition);
    }
    .captcha-btn:hover { color: var(--accent); background: rgba(25, 118, 210, 0.08); }
    .dark .captcha-btn:hover { background: rgba(59, 130, 246, 0.14); }
    .captcha-btn svg { width: 15px; height: 15px; }

    /* 点刷新时图标转一圈，让"换了一张"这件事有反馈 */
    .captcha-btn.spinning svg { animation: captchaSpin 0.5s ease; }
    @keyframes captchaSpin { to { transform: rotate(360deg); } }

    /* 密码显示/隐藏：绝对定位挂在字段右侧，不新增一行，不占布局高度 */
    .field-wrap { position: relative; }
    .field-wrap input { padding-right: 46px; }

    .pw-toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: color var(--transition), background var(--transition);
    }
    .pw-toggle:hover { color: var(--accent); background: rgba(25, 118, 210, 0.08); }
    .dark .pw-toggle:hover { background: rgba(59, 130, 246, 0.14); }
    .pw-toggle svg { width: 16px; height: 16px; }
    .pw-toggle .ico-eyeoff { display: none; }
    .pw-toggle.showing .ico-eye { display: none; }
    .pw-toggle.showing .ico-eyeoff { display: block; }

    /* 校验未过：出错的字段描红。写在 :focus / :focus-within 之后，靠顺序取胜 */
    .form-group input.invalid,
    .captcha-field.invalid,
    .captcha-field.invalid:focus-within {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.12);
    }
    .dark .form-group input.invalid,
    .dark .captcha-field.invalid,
    .dark .captcha-field.invalid:focus-within {
      box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.20);
    }

    .btn-login {
      width: 100%;
      /* 字距 6px 会在末字后多出 6px 空隙，左侧补等量 padding 才真正居中 */
      padding: 13px 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 3px;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
      box-shadow: 0 4px 14px rgba(25, 118, 210, 0.28);
    }
    .dark .btn-login { box-shadow: 0 4px 14px rgba(59, 130, 246, 0.30); }

    .btn-login:hover { background: var(--accent-hover); }
    .btn-login:active { transform: translateY(1px); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }

    /* 报错放在按钮上方：视线还在字段上时就能看见，不用跑到按钮下面去找。
       不再常驻 20px 占位——空状态下不撑高度，出错时按钮轻微下移一次，比天天挂着一段空白划算 */
    .error-msg {
      font-size: 13px;
      line-height: 18px;
      color: var(--danger);
      margin-bottom: 12px;
      text-align: center;
    }

    /* 窄屏：展示区收起为一条品牌带，不占整屏 */
    @media (max-width: 900px) {
      .login-container {
        flex-direction: column;
        width: 100%;
        max-width: 460px;
        min-height: auto;
      }
      /* 收成一条品牌带：不再有"左右"，接缝的暗部换成一条底边发丝线 */
      .login-showcase { padding: 26px 26px 22px; flex: none; box-shadow: inset 0 -1px 0 var(--seam); }
      .show-copy { display: none; }
      .login-form { padding: 28px 26px 30px; }
    }

    @media (max-height: 640px) and (min-width: 901px) {
      .login-container { min-height: 480px; }
      .login-showcase { padding: 28px 30px; }
      .show-headline { font-size: 22px; }
      .show-flow { margin-top: 20px; }
      .show-flow-item { padding: 8px 0; }
      .login-form { padding: 32px 38px; }
      .login-form h1 { margin-bottom: 22px; }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="scene-photo"></div>
    <div class="scene-tint"></div>
    <div class="scene-vignette"></div>
  </div>

  <div class="login-container">
    <div class="login-showcase">
      <div class="show-brand">
        <div class="show-logo">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OmniAssist">
            <defs>
              <linearGradient id="oa-brand" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#3B82F6"/>
                <stop offset="52%" stop-color="#6366F1"/>
                <stop offset="100%" stop-color="#8B5CF6"/>
              </linearGradient>
            </defs>
            <rect width="48" height="48" rx="13" fill="url(#oa-brand)"/>
            <!-- 外环：缺口朝右下，代表向外交付 -->
            <path d="M24 36 A 12 12 0 1 1 36 24" stroke="#FFFFFF" stroke-width="2.9" stroke-linecap="round"/>
            <!-- 内环：缺口朝左上，与外环反向，形成"内外两圈在转"的关系 -->
            <path d="M24 18 A 6 6 0 1 1 18 24" stroke="#FFFFFF" stroke-width="2.9" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="show-brand-name">Omni<span class="bn-mark">Assist</span></div>
          <div class="show-brand-tag">通用智能体服务平台</div>
        </div>
      </div>

      <div class="show-copy">
        <h2 class="show-headline">把一句话<br>变成一份能交付的成果</h2>

        <ol class="show-flow">
          <li class="show-flow-item">自然语言下达任务</li>
          <li class="show-flow-item">沙箱内执行工具与脚本</li>
          <li class="show-flow-item">敏感操作经审批后执行</li>
        </ol>

      </div>
    </div>

    <div class="login-form">
      <h1 id="greeting">欢迎回来</h1>
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <div class="field-wrap">
          <input type="password" id="password" autocomplete="current-password">
          <button type="button" class="pw-toggle" id="pw-toggle" title="显示密码" aria-label="显示密码">
            <svg class="ico-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="ico-eyeoff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label for="captcha-code">图形验证码</label>
        <div class="captcha-field">
          <input type="text" id="captcha-code" autocomplete="off" maxlength="4">
          <div class="captcha-img" id="captcha-img" title="点击刷新验证码">
            <span class="captcha-text">...</span>
          </div>
          <button type="button" class="captcha-btn" id="captcha-refresh" title="刷新验证码" aria-label="刷新验证码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
          </button>
        </div>
      </div>
      <div class="error-msg" id="error-msg" role="status" aria-live="polite"></div>
      <button class="btn-login" id="btn-login" onclick="handleLogin()">登录</button>
    </div>
  </div>

  <script>
    (function() {
      const hour = new Date().getHours();
      const greetingEl = document.getElementById('greeting');

      let timeClass = '';
      let greeting = '';
      if (hour >= 5 && hour < 11) {
        greeting = '早上好，欢迎回来';
        timeClass = 'time-morning';
      } else if (hour >= 11 && hour < 13) {
        greeting = '中午好，欢迎回来';
        timeClass = 'time-noon';
      } else if (hour >= 13 && hour < 18) {
        greeting = '下午好，欢迎回来';
        timeClass = 'time-afternoon';
      } else if (hour >= 18 && hour < 20) {
        greeting = '傍晚好，欢迎回来';
        timeClass = 'time-evening';
      } else {
        greeting = '晚上好，欢迎回来';
        timeClass = 'time-night';
      }
      greetingEl.textContent = greeting;
      // 时段只加在 body 上：色调层统一由 --scene-tint 驱动，背景照片不跟着换
      document.body.classList.add(timeClass);

      function applyTheme() {
        const saved = localStorage.getItem('theme');
        if (saved === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (saved === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        }
      }
      applyTheme();

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        const saved = localStorage.getItem('theme');
        if (!saved || saved === 'auto') applyTheme();
      });
    })();

    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const captchaInput = document.getElementById('captcha-code');
    const captchaImg = document.getElementById('captcha-img');
    const errorMsg = document.getElementById('error-msg');
    const btnLogin = document.getElementById('btn-login');

    let currentCaptchaId = '';

    // 校验失败时只给一行红字，等于让人自己找哪个框错了。
    // 所以同时把出错的字段描红、把光标送回去。
    // 验证码字段的边框画在外层容器上，取值时才拿得到它。
    function fieldBox(el) {
      return el.closest('.captcha-field') || el;
    }

    function showFieldError(el, msg) {
      errorMsg.textContent = msg;
      fieldBox(el).classList.add('invalid');
      el.focus();
    }

    function clearFieldError(el) {
      if (fieldBox(el).classList.contains('invalid')) {
        fieldBox(el).classList.remove('invalid');
      }
      if (errorMsg.textContent) errorMsg.textContent = '';
    }

    [usernameInput, passwordInput, captchaInput].forEach((el) => {
      el.addEventListener('input', () => clearFieldError(el));
    });

    async function loadCaptcha() {
      try {
        const res = await fetch('/api/auth/captcha', { cache: 'no-store' });
        if (!res.ok) throw new Error('load failed');
        const data = await res.json();
        currentCaptchaId = data.captcha_id || '';
        if (data.image && data.image.startsWith('data:image')) {
          captchaImg.innerHTML = `<img src="${data.image}" alt="验证码">`;
        } else {
          // 降级：无图模式下直接展示 code（Pillow 缺失时）
          captchaImg.innerHTML = `<span class="captcha-text">${data.image || '????'}</span>`;
        }
      } catch (e) {
        // 图片本身就是可点的重试入口，所以提示要直接把动作说出来
        captchaImg.innerHTML = `<span class="captcha-retry">点击重试</span>`;
      }
    }

    // 刷新：图标转一圈，让"换了一张"这件事有反馈。
    // 先移除类再强制重排，否则连续点击第二次不会重放动画。
    function refreshCaptcha() {
      const btn = document.getElementById('captcha-refresh');
      btn.classList.remove('spinning');
      void btn.offsetWidth;
      btn.classList.add('spinning');
      loadCaptcha();
    }
    captchaImg.addEventListener('click', refreshCaptcha);
    document.getElementById('captcha-refresh').addEventListener('click', refreshCaptcha);
    loadCaptcha();

    // 密码显示/隐藏：切 type 即可，切完把光标留在原处（密码一长就靠这个回位）
    const pwToggle = document.getElementById('pw-toggle');
    pwToggle.addEventListener('click', () => {
      const willShow = passwordInput.type === 'password';
      passwordInput.type = willShow ? 'text' : 'password';
      pwToggle.classList.toggle('showing', willShow);
      pwToggle.title = willShow ? '隐藏密码' : '显示密码';
      pwToggle.setAttribute('aria-label', pwToggle.title);
      passwordInput.focus();
    });

    let isComposing = false;
    const setComposing = (v) => { isComposing = v; };
    usernameInput.addEventListener('compositionstart', () => setComposing(true));
    usernameInput.addEventListener('compositionend', () => setComposing(false));
    passwordInput.addEventListener('compositionstart', () => setComposing(true));
    passwordInput.addEventListener('compositionend', () => setComposing(false));
    captchaInput.addEventListener('compositionstart', () => setComposing(true));
    captchaInput.addEventListener('compositionend', () => setComposing(false));

    // 输入法（IME）组字过程中按 Enter 选词不应触发登录：
    // 同时用原生 e.isComposing 与手动标志位双重判断，兼容各浏览器
    const onEnterSubmit = (e) => {
      if (e.key === 'Enter' && !isComposing && !e.isComposing && e.keyCode !== 229) {
        handleLogin();
      }
    };
    passwordInput.addEventListener('keydown', onEnterSubmit);
    captchaInput.addEventListener('keydown', onEnterSubmit);
    usernameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !isComposing && !e.isComposing && e.keyCode !== 229) {
        passwordInput.focus();
      }
    });

    // 触屏设备不自动聚焦：一进页面就弹键盘，会把表单顶出屏幕
    if (!window.matchMedia('(hover: none) and (pointer: coarse)').matches) {
      usernameInput.focus();
    }

    async function handleLogin() {
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const captchaCode = captchaInput.value.trim();

      if (!username) { showFieldError(usernameInput, '请输入用户名'); return; }
      if (!password) { showFieldError(passwordInput, '请输入密码'); return; }
      if (!captchaCode) { showFieldError(captchaInput, '请输入图形验证码'); return; }

      btnLogin.disabled = true;
      btnLogin.textContent = '登录中...';
      errorMsg.textContent = '';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username,
            password,
            captcha_id: currentCaptchaId,
            captcha_code: captchaCode
          })
        });

        if (res.ok) {
          const data = await res.json();
          document.cookie = `auth_token=${data.token}; path=/; max-age=604800; SameSite=Lax`;
          if (data.must_change_password) {
            window.location.href = '/?must_change_password=1';
          } else {
            window.location.href = '/';
          }
        } else {
          const data = await res.json();
          errorMsg.textContent = data.detail || '登录失败';
          // 登录失败（含验证码错误）刷新验证码，避免复用
          captchaInput.value = '';
          loadCaptcha();
        }
      } catch (e) {
        errorMsg.textContent = '网络错误，请重试';
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = '登录';
      }
    }
  </script>
</body>
</html>
