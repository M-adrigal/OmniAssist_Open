<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="52%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#g)"/>
  <!-- 与界面同一枚标记的 16px 版本：外圈那道弧 + 中心实心点。
       完整的内外双环缩到 16px 会糊成一团，只剩一个白饼，
       所以这里只保留一眼能认出的"外圈 + 芯"两层关系。 -->
  <path d="M16 25 A 9 9 0 1 1 25 16" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="3.6" fill="#FFFFFF"/>
</svg>
