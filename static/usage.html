<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token 消耗统计 · OmniAssist</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f7f7f8;
    --bg-card: #ffffff;
    --text: #1a1a2e;
    --text-2: #6b6b80;
    --text-3: #9a9ab0;
    --border: #e0e0e8;
    --accent: #1976d2;
    --accent-soft: rgba(25, 118, 210, 0.10);
    --ok: #2e9e5b;
    --ok-soft: rgba(46, 158, 91, 0.12);
    --cache: #7c5cff;
    --cache-soft: rgba(124, 92, 255, 0.14);
    /* 柱状图：输入浅蓝、输出深蓝 */
    --bar-in: #7ab8ee;
    --bar-out: #1a4f9c;
    --warn: #d98324;
    --warn-soft: rgba(217, 131, 36, 0.14);
    --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    --radius: 10px;
  }
  html.dark {
    --bg: #111111;
    --bg-soft: #1a1a1a;
    --bg-card: #1a1a1a;
    --text: #ffffff;
    --text-2: #aaaaaa;
    --text-3: #6f6f6f;
    --border: #2f2f2f;
    --accent: #4b9fe1;
    --accent-soft: rgba(75, 159, 225, 0.16);
    --ok: #4cbb7f;
    --ok-soft: rgba(76, 187, 127, 0.16);
    --cache: #a08cff;
    --cache-soft: rgba(160, 140, 255, 0.18);
    --bar-in: #8fd0ff;
    --bar-out: #2f6fc4;
    --warn: #e0a355;
    --warn-soft: rgba(224, 163, 85, 0.18);
    --shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-soft);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }

  /* 顶部 */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .top h1 { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .link-btn, .btn {
    border: 1px solid var(--border); background: var(--bg-card); color: var(--text);
    border-radius: 8px; padding: 7px 13px; font-size: 13px; cursor: pointer;
    transition: .18s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    font-family: inherit;
  }
  .link-btn:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* 筛选 */
  .filters {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;
  }
  .seg { display: inline-flex; background: var(--bg-soft); border-radius: 8px; padding: 3px; gap: 2px; }
  .seg button {
    border: 0; background: transparent; color: var(--text-2); font-size: 13px;
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-family: inherit; transition: .15s;
    font-weight: 500;
  }
  .seg button.active { background: var(--bg-card); color: var(--text); box-shadow: var(--shadow); }
  .filters input[type="date"] {
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    border-radius: 7px; padding: 6px 9px; font-size: 13px; font-family: inherit;
  }
  .filters .spacer { flex: 1; }
  /* 固定占位：切换范围/全平台时右侧文字长度变化不再推动整行 */
  #range-label { text-align: right; white-space: nowrap; min-width: 176px; }
  .scope-hint { font-size: 12px; color: var(--text-3); }
  .scope-hint.pending-warn { color: var(--warn); margin-left: 10px; }
  .scope-hint.pending-warn.hidden { display: none; }

  /* KPI */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px;
  }
  .kpi .label { font-size: 12px; color: var(--text-2); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .kpi .value {
    font-size: 22px; font-weight: 700; letter-spacing: .3px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .kpi .meta { font-size: 11.5px; color: var(--text-3); margin-top: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.in { background: var(--bar-in); }
  .dot.out { background: var(--bar-out); }
  .dot.cache { background: var(--cache); }
  .dot.total { background: var(--text-2); }
  .tag-est {
    display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px;
    background: var(--warn-soft); color: var(--warn); border: 1px solid transparent;
  }
  .rate-sub { color: var(--text-3); font-size: 11.5px; font-weight: 400; }

  /* 模型消耗表 */
  .model-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .model-table th {
    text-align: left; font-weight: 600; color: var(--text-3); font-size: 11.5px;
    padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  .model-table th.num, .model-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .model-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .model-table tr:last-child td { border-bottom: none; }
  .model-table .m-name { font-weight: 600; color: var(--text); }
  .model-table .m-id { color: var(--text-3); font-size: 11.5px; margin-top: 2px; word-break: break-all; }
  .model-table .empty { color: var(--text-3); text-align: center; padding: 22px 0; }
  .key-tag {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 4px; white-space: nowrap;
    background: var(--bg-2, rgba(0,0,0,.05)); color: var(--text-2); border: 1px solid var(--border);
  }
  .key-tag.self { background: var(--warn-soft); color: var(--warn); border-color: transparent; }

  /* 图表 */
  .card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px 10px; margin-bottom: 16px; position: relative;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; flex-wrap: wrap; gap: 8px; }
  .card-head h2 { font-size: 14.5px; font-weight: 650; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend b { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  #chart { width: 100%; height: 260px; display: block; overflow: visible; }
  #chart .grid { stroke: var(--border); stroke-width: 1; stroke-dasharray: 3 4; }
  #chart .axis-text { fill: var(--text-3); font-size: 11px; }
  #chart .bar-in { fill: var(--bar-in); transition: opacity .15s; }
  #chart .bar-out { fill: var(--bar-out); transition: opacity .15s; }
  #chart .bar:hover { opacity: .78; }
  .tip {
    position: absolute; pointer-events: none; background: var(--text); color: var(--bg);
    font-size: 12px; padding: 7px 10px; border-radius: 6px; white-space: nowrap;
    opacity: 0; transition: opacity .12s; z-index: 5; line-height: 1.6;
  }
  .empty { text-align: center; color: var(--text-3); font-size: 13px; padding: 46px 0; }

  /* 表格 */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; font-weight: 600; color: var(--text-2); font-size: 12px;
    padding: 10px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 11px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:hover { background: var(--bg-soft); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sess-title { max-width: 280px; }
  .sess-title button {
    background: none; border: 0; color: var(--text); font-size: 13px; cursor: pointer;
    text-align: left; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 0; font-family: inherit;
  }
  .sess-title button:hover { color: var(--accent); text-decoration: underline; }
  .sess-id {
    font-size: 10.5px; color: var(--text-2); opacity: .8; margin-top: 2px;
    font-variant-numeric: tabular-nums; letter-spacing: .4px;
  }
  .src-chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .chip {
    font-size: 11px; padding: 2px 7px; border-radius: 999px;
    background: var(--bg-soft); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap;
  }
  .chip.chat { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .chip.title, .chip.compress { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .chip.subagent, .chip.skill { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .time-cell { color: var(--text-2); font-size: 12.5px; white-space: nowrap; }

  /* 会话搜索 */
  .sess-search {
    width: 200px; height: 30px; padding: 0 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg-card); color: var(--text);
    font-size: 12.5px; font-family: inherit; outline: none;
  }
  .sess-search:focus { border-color: var(--accent); }
  .sess-search::placeholder { color: var(--text-3); }

  /* 模型标签：会话内可能切换过多个模型，全部列出，多到放不下时收成 +N */
  .model-chips { display: flex; gap: 5px; flex-wrap: wrap; max-width: 230px; }
  .model-chip {
    font-size: 11px; padding: 2px 7px; border-radius: 6px; white-space: nowrap;
    background: var(--bg-soft); color: var(--text-2); border: 1px solid var(--border);
    max-width: 190px; overflow: hidden; text-overflow: ellipsis;
  }
  /* 用户自带 Key 的消耗不计入平台成本，用不同底色区分 */
  .model-chip.self-pay {
    background: rgba(124, 92, 255, 0.10);
    border-color: rgba(124, 92, 255, 0.35);
    color: var(--cache);
  }

  /* 明细弹窗的筛选条 */
  .detail-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 4px 0 12px; position: sticky; top: 0; background: var(--bg-card); z-index: 2;
  }
  .detail-bar label { font-size: 12.5px; color: var(--text-2); }
  .detail-bar select {
    height: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text); font-size: 12.5px; font-family: inherit;
    width: 250px; max-width: 100%;
  }
  .detail-bar .detail-count { font-size: 12px; color: var(--text-3); }
  .model-cell {
    font-size: 11.5px; color: var(--text-2); max-width: 180px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .detail-foot { font-size: 12px; color: var(--text-3); padding: 10px 2px 2px; }

  /* 分页 */
  .pager { display: flex; align-items: center; justify-content: space-between; padding: 14px 4px 4px; gap: 12px; flex-wrap: wrap; }
  .pager .info { font-size: 12.5px; color: var(--text-2); }
  .pager .pages { display: flex; gap: 6px; align-items: center; }
  .pager .pages button {
    min-width: 32px; height: 30px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text); font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .pager .pages button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pager .pages button:disabled { opacity: .4; cursor: not-allowed; }

  /* 明细弹窗 */
  .modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal.hidden { display: none; }
  .modal-mask { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
  .modal-box {
    position: relative; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; width: min(860px, 92vw); max-height: 82vh; display: flex; flex-direction: column;
    box-shadow: 0 12px 48px rgba(0,0,0,.3);
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { font-size: 14.5px; font-weight: 650; }
  .modal-body { overflow: auto; padding: 6px 18px 16px; }
  .modal-close { background: none; border: 0; font-size: 22px; line-height: 1; color: var(--text-2); cursor: pointer; }
  .loading { text-align: center; color: var(--text-3); font-size: 13px; padding: 40px 0; }
  .err { color: #e05252; font-size: 13px; padding: 12px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Token 消耗统计</h1>
    </div>
    <div class="top-actions">
      <button class="btn" id="btn-refresh">刷新</button>
      <button class="link-btn" id="btn-back">返回对话</button>
    </div>
  </div>

  <div class="filters">
    <div class="seg" id="range-seg">
      <button data-range="today">今天</button>
      <button data-range="7">近 7 天</button>
      <button data-range="30" class="active">近 30 天</button>
      <button data-range="custom">自定义</button>
    </div>
    <span id="custom-range" style="display:none; gap:8px; align-items:center;">
      <input type="date" id="date-start">
      <span class="scope-hint">至</span>
      <input type="date" id="date-end">
      <button class="btn" id="btn-apply-range">查询</button>
    </span>
    <span class="spacer"></span>
    <span id="scope-wrap" style="display:none;">
      <span class="seg" id="scope-seg">
        <button data-scope="self" class="active">我的用量</button>
        <button data-scope="all">全平台</button>
      </span>
    </span>
    <span class="scope-hint" id="range-label"></span>
    <span class="scope-hint pending-warn hidden" id="pending-note"></span>
  </div>

  <div class="kpis">
    <div class="kpi">
      <div class="label"><span class="dot total"></span>总 Token</div>
      <div class="value" id="kpi-total">—</div>
      <div class="meta" id="kpi-total-meta">&nbsp;</div>
    </div>
    <div class="kpi">
      <div class="label"><span class="dot in"></span>输入 Token</div>
      <div class="value" id="kpi-prompt">—</div>
      <div class="meta" id="kpi-cached">&nbsp;</div>
    </div>
    <div class="kpi">
      <div class="label"><span class="dot cache"></span>缓存命中率</div>
      <div class="value" id="kpi-cache-rate">—</div>
      <div class="meta" id="kpi-cache-meta">&nbsp;</div>
    </div>
    <div class="kpi">
      <div class="label"><span class="dot out"></span>输出 Token</div>
      <div class="value" id="kpi-completion">—</div>
      <div class="meta" id="kpi-reasoning">&nbsp;</div>
    </div>
    <div class="kpi">
      <div class="label">模型调用次数</div>
      <div class="value" id="kpi-calls">—</div>
      <div class="meta" id="kpi-est">&nbsp;</div>
    </div>
  </div>

  <div class="card" id="chart-card">
    <div class="card-head">
      <h2>每日消耗</h2>
      <div class="legend">
        <span><i class="dot in"></i>输入</span>
        <span><i class="dot out"></i>输出</span>
      </div>
    </div>
    <svg id="chart" viewBox="0 0 1000 260" preserveAspectRatio="none"></svg>
    <div class="tip" id="tip"></div>
  </div>

  <div class="card" id="model-card">
    <div class="card-head">
      <h2>模型消耗</h2>
      <span class="scope-hint">按模型 / 供应商拆分，标注 Key 归属</span>
    </div>
    <table class="model-table">
      <thead>
        <tr>
          <th>模型</th>
          <th>供应商</th>
          <th>Key 归属</th>
          <th class="num">调用</th>
          <th class="num">总 Token</th>
          <th class="num">输入 / 输出</th>
          <th class="num">缓存命中</th>
        </tr>
      </thead>
      <tbody id="model-body">
        <tr><td colspan="7" class="empty">加载中...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>会话明细</h2>
      <input type="search" class="sess-search" id="sess-q" placeholder="搜索会话名称" autocomplete="off">
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>最近消耗时间</th>
            <th>会话</th>
            <th>模型</th>
            <th>消耗来源</th>
            <th class="num">输入</th>
            <th class="num">缓存命中率</th>
            <th class="num">输出</th>
            <th class="num">总 Token</th>
            <th class="num">调用</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="9" class="loading">加载中…</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pager">
      <div class="info" id="page-info">—</div>
      <div class="pages" id="page-buttons"></div>
    </div>
  </div>
</div>

<div class="modal hidden" id="detail-modal">
  <div class="modal-mask" id="detail-mask"></div>
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="detail-title">调用明细</h3>
      <button class="modal-close" id="detail-close">&times;</button>
    </div>
    <div class="modal-body" id="detail-body">
      <div class="loading">加载中…</div>
    </div>
  </div>
</div>

<script src="/static/usage.js"></script>
</body>
</html>
